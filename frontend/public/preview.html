<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미리보기</title>
<!--
  PreviewDock 의 라이브 미리보기 틀.
  부모 화면이 postMessage 로 { cogi: "doc", html } 을 보내면 그 문서로 통째로 바꾼다.
  srcDoc 대신 이 파일을 쓰는 까닭: srcDoc 문서는 앱의 CSP 를 물려받아 인라인 스크립트가 막힌다.
  이 파일은 서버(Caddy)가 인라인 스크립트를 허용하는 CSP 를 따로 준다.
  iframe 은 sandbox="allow-scripts"(allow-same-origin 없음)라 여기서 도는 코드는 앱의 쿠키와 화면에 닿지 못한다.
-->
<script>
  (function () {
    var done = false;
    window.addEventListener('message', function (e) {
      if (done || e.source !== window.parent) return;
      var d = e.data || {};
      if (d.cogi !== 'doc' || typeof d.html !== 'string') return;
      done = true;
      document.open();
      document.write(d.html);
      document.close();
    });
    // 틀이 떴다고 알린다. 이 신호가 안 오면 부모는 예전 방식(srcDoc)으로 그린다
    window.parent.postMessage({ cogi: 'frame-ready' }, '*');
  })();
</script>
</head>
<body></body>
</html>
