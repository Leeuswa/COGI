<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover라야 아이폰 노치·홈바 영역까지 쓰고 safe-area 값이 채워진다.
       확대는 막지 않는다. user-scalable=no 는 글자가 작아 안 보이는 사람이 손가락으로 키울 길을 막아서 뺐다(WCAG 1.4.4) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>COGI · Code Guide</title>
  <meta name="description" content="GitHub Pull Request를 AI가 리뷰하고, 반복된 지적을 약점으로 모아 학습 카드와 퀴즈로 돌려주는 코드 리뷰 학습 서비스">

  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- 홈 화면에 추가했을 때 브라우저 주소창 없이 전체화면 앱으로 뜨게 한다 -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#cfe8ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="COGI" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <!-- 픽셀 폰트 2종. Galmuri(한글 도트) + Silkscreen(영문 아케이드)
       Galmuri 는 판을 고정하고 integrity 로 내용을 묶는다. 판 없이 받으면 CDN 의 새 판이 그대로 따라 들어온다.
       판을 올릴 때는 새 파일의 sha384 를 다시 구해 integrity 를 바꾼다.
       구글 폰트는 요청한 브라우저마다 CSS 가 달라 integrity 를 걸 수 없다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css"
        integrity="sha384-55uQGdclWjXwWY0yHikdtcfcat9pPBqMBCVFIeWjRhvPPUYbpJLhIJegzTcFoh/A" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
